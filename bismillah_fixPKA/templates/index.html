<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FilmAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:    #f3f0fa;
  --bg2:   #ece8f5;
  --bg3:   #e4dff2;
  --bg4:   #d8d1ed;

  --purple:  #7c5cbf;
  --purple2: #9b7dd4;
  --purple3: #b89ee8;
  --purple4: #d4c8f5;
  --accent:  #6244aa;

  --border:  rgba(124,92,191,0.12);
  --border2: rgba(124,92,191,0.22);
  --border3: rgba(124,92,191,0.38);

  --text:   #2d2440;
  --muted:  #8878aa;
  --muted2: #b0a4cc;

  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans:  'Josefin Sans', 'Helvetica Neue', sans-serif;
  --r: 12px;

  --glow: 0 0 24px rgba(124,92,191,0.15), 0 0 60px rgba(124,92,191,0.06);
  --glow-btn: 0 4px 18px rgba(124,92,191,0.4);
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden}

body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 15% 10%, rgba(180,150,240,0.18) 0%, transparent 65%),
    radial-gradient(ellipse 60% 50% at 85% 80%, rgba(140,110,220,0.12) 0%, transparent 65%),
    radial-gradient(ellipse 40% 60% at 50% 50%, rgba(200,180,255,0.07) 0%, transparent 70%);
}

/* Layout */
.app{display:grid;grid-template-columns:300px 1fr;height:100vh;position:relative;z-index:1}

/* Sidebar */
.sidebar{
  background:linear-gradient(175deg, #e8e2f5 0%, #ddd6f0 100%);
  border-right:1px solid var(--border2);
  display:flex;flex-direction:column;
  padding:32px 24px 24px;
  gap:28px;overflow-y:auto;position:relative;
}
.sidebar::after{
  content:'';position:absolute;top:0;right:-1px;width:2px;height:100%;
  background:linear-gradient(to bottom,
    transparent 0%,
    var(--purple3) 20%,
    var(--purple2) 50%,
    var(--purple3) 80%,
    transparent 100%
  );
  opacity:.6;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* Logo */
.logo{display:flex;flex-direction:column;gap:4px;padding-bottom:4px}
.logo-eyebrow{font-size:8px;letter-spacing:5px;text-transform:uppercase;color:var(--purple2);font-weight:600}
.logo-title{
  font-family:var(--serif);font-size:44px;font-weight:700;
  background:linear-gradient(150deg, var(--accent) 0%, var(--purple2) 60%, var(--purple3) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:.92;letter-spacing:-1px;
  filter:drop-shadow(0 2px 10px rgba(124,92,191,.2));
}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:6px;font-weight:300}

/* Divider */
.divider{
  height:1px;flex-shrink:0;
  background:linear-gradient(to right, transparent, var(--border3) 40%, var(--purple3) 50%, var(--border3) 60%, transparent);
  opacity:.6;
}

/* Label */
.label{
  font-family:var(--sans);font-size:8px;letter-spacing:4px;text-transform:uppercase;
  color:var(--purple);font-weight:600;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.label::before{content:'';width:12px;height:1px;background:var(--purple);opacity:.5}
.label::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--border2),transparent)}

/* Chips */
.chips{display:flex;flex-direction:column;gap:6px}
.chip{
  background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:10px;
  padding:9px 13px;font-size:12.5px;font-family:var(--sans);
  color:var(--muted);cursor:pointer;
  transition:all .2s ease;text-align:left;line-height:1.5;font-weight:300;
  position:relative;overflow:hidden;backdrop-filter:blur(4px);
}
.chip:hover{
  border-color:var(--border3);color:var(--purple);
  background:rgba(255,255,255,.85);
  transform:translateX(3px);
  box-shadow:0 2px 12px rgba(124,92,191,.12);
}

/* Stats */
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.stat-k{font-size:10px;color:var(--muted);letter-spacing:.5px;font-weight:300}
.stat-v{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--purple)}

/* Reset */
.btn-reset{
  margin-top:auto;background:rgba(255,255,255,.5);
  border:1px solid var(--border2);border-radius:10px;
  padding:10px 14px;color:var(--muted);font-size:9px;letter-spacing:3px;
  text-transform:uppercase;cursor:pointer;font-family:var(--sans);
  transition:all .2s;font-weight:600;
}
.btn-reset:hover{
  border-color:rgba(200,80,80,.35);color:#c05555;
  background:rgba(255,200,200,.15);
}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* Header */
.header{
  padding:20px 32px;border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:16px;
  background:linear-gradient(90deg, #e8e2f5 0%, var(--bg) 100%);
  flex-shrink:0;
}
.header-left{flex:1}
.header-title{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--accent);letter-spacing:.3px}
.header-sub{font-size:9px;color:var(--muted);letter-spacing:2.5px;margin-top:3px;text-transform:uppercase}
.live-badge{
  display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:2px;
  text-transform:uppercase;color:#5a9e6a;
  border:1px solid rgba(90,158,106,.25);border-radius:20px;
  padding:5px 13px;background:rgba(90,158,106,.07);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:#6abf7a;
  box-shadow:0 0 8px rgba(106,191,122,.7);
  animation:livepulse 2.5s ease-in-out infinite;
}
@keyframes livepulse{0%,100%{box-shadow:0 0 6px rgba(106,191,122,.5)}50%{box-shadow:0 0 16px rgba(106,191,122,.9)}}

/* Chat window */
.chat-window{
  flex:1;overflow-y:auto;padding:36px 36px 24px;
  display:flex;flex-direction:column;gap:24px;
}
.chat-window::-webkit-scrollbar{width:4px}
.chat-window::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* Welcome */
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.welcome{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;text-align:center;gap:18px;padding:60px 40px;
  animation:fadein .7s ease;
}
.welcome-ornament{
  font-family:var(--serif);font-size:72px;font-weight:300;font-style:italic;
  background:linear-gradient(150deg, var(--purple2), var(--purple3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;letter-spacing:-2px;
  filter:drop-shadow(0 4px 20px rgba(124,92,191,.2));
}
.welcome-title{
  font-family:var(--serif);font-size:30px;font-weight:600;
  background:linear-gradient(140deg, var(--accent) 20%, var(--purple2) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.welcome-line{width:80px;height:1px;background:linear-gradient(to right,transparent,var(--purple2),transparent)}
.welcome-text{font-size:12px;color:var(--muted);letter-spacing:.8px;line-height:2;max-width:380px;font-weight:300}

/* Messages */
.msg{display:flex;gap:14px;max-width:800px;animation:fadein .25s ease}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}

.avatar{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:13px;font-style:italic;
  flex-shrink:0;margin-top:3px;font-weight:600;
}
.msg.user .avatar{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;border:none}
.msg.bot .avatar{background:linear-gradient(135deg,#fff,var(--purple4));color:var(--purple);border:1px solid var(--border2)}

.bubble{padding:14px 18px;border-radius:var(--r);font-size:15px;line-height:1.85;max-width:680px;word-break:break-word;font-weight:300}
.msg.user .bubble{
  background:linear-gradient(135deg, #6e84f0, #7b6fd4);
  border:none;border-bottom-right-radius:4px;color:#fff;
  box-shadow:0 4px 18px rgba(110,132,240,.3);
}
.msg.bot .bubble{
  background:#fff;border:1px solid var(--border2);
  border-bottom-left-radius:4px;color:var(--text);
  box-shadow:0 2px 16px rgba(124,92,191,.1);
}
.msg.bot .bubble strong{color:var(--purple);font-family:var(--serif);font-size:15px;font-weight:700}
.msg.bot .bubble em{color:var(--muted)}
.msg.bot .bubble code{background:rgba(124,92,191,.08);color:var(--purple);border:1px solid var(--border2);padding:2px 6px;border-radius:4px;font-size:12px}

/* Badge hidden */
.badge{display:none}

/* Typing */
.typing .bubble{padding:16px 20px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;opacity:.4;animation:bounce 1.4s infinite}
.dot:nth-child(1){background:var(--purple3)}
.dot:nth-child(2){background:var(--purple2);animation-delay:.2s}
.dot:nth-child(3){background:var(--purple);animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-7px);opacity:1}}

/* Input area */
.input-area{
  flex-shrink:0;padding:20px 32px 24px;
  border-top:1px solid var(--border2);
  background:linear-gradient(0deg, #ddd6f0 0%, var(--bg) 100%);
}
.input-frame{
  display:flex;gap:10px;align-items:flex-end;
  background:rgba(255,255,255,.7);border:1px solid var(--border2);border-radius:var(--r);
  padding:12px 14px;transition:border-color .25s,box-shadow .25s;
  backdrop-filter:blur(6px);
}
.input-frame:focus-within{
  border-color:var(--purple2);
  box-shadow:0 0 0 3px rgba(124,92,191,.1),var(--glow);
}
textarea{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--sans);font-size:15px;
  resize:none;max-height:100px;line-height:1.6;padding:1px 0;font-weight:300;
}
textarea::placeholder{color:var(--muted2)}
.send-btn{
  width:36px;height:36px;flex-shrink:0;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  border:none;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s,transform .1s,box-shadow .2s;
  font-size:14px;box-shadow:var(--glow-btn);color:#fff;
}
.send-btn:hover{opacity:.88;box-shadow:0 6px 24px rgba(124,92,191,.5)}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none}
.input-hint{font-size:10px;color:var(--muted2);letter-spacing:.5px;margin-top:8px;font-weight:300}

/* Toast */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:rgba(255,240,240,.9);border:1px solid rgba(200,80,80,.25);
  border-radius:10px;padding:12px 18px;font-size:12px;color:#c05555;
  display:none;z-index:100;max-width:340px;
  animation:fadein .2s ease;backdrop-filter:blur(10px);
  box-shadow:0 8px 24px rgba(0,0,0,.1);
}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-eyebrow">Database Film</div>
      <div class="logo-title">FilmAI</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Coba Tanya</div>
      <div class="chips" id="exChips">
        <button class="chip">Rekomendasi film horror terbaik</button>
        <button class="chip">Ceritakan Avatar: The Way of Water</button>
        <button class="chip">Siapa pemeran The Super Mario Bros. Movie?</button>
        <button class="chip">Film action dengan budget terbesar?</button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Info</div>
      <div class="stats">
        <div class="stat"><span class="stat-k">Sumber</span><span class="stat-v">IMDB Dataset</span></div>
      </div>
    </div>

    <button class="btn-reset" id="resetBtn">↺ &nbsp; Reset Percakapan</button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Movie Intelligence</div>
      </div>
      <div class="live-badge"><div class="live-dot"></div>Ready</div>
    </div>

    <div class="chat-window" id="chatWindow">
      <div class="welcome" id="welcomeMsg">
        <div class="welcome-ornament">❝</div>
        <div class="welcome-title">Apa yang ingin kamu ketahui?</div>
        <div class="welcome-line"></div>
        <div class="welcome-text">
          Tanya tentang sinopsis, pemeran, budget, skor, genre, atau minta rekomendasi.<br>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-frame">
        <textarea id="userInput" rows="1" placeholder="Tulis pertanyaan tentang film..."></textarea>
        <button class="send-btn" id="sendBtn" title="Kirim">➤</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let sessionId = null, isLoading = false;

const ta = document.getElementById('userInput');
const win = document.getElementById('chatWindow');

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 4500);
}

function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,100)+'px'}

function md(text){
  return text
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>')
    .replace(/^[-•] (.+)$/gm,'<span style="display:block;padding-left:16px;position:relative;margin:2px 0"><span style="position:absolute;left:4px;color:var(--gold2)">—</span>$1</span>')
    .replace(/\n/g,'<br>');
}

function addMsg(role, content, movies){
  const welcome = document.getElementById('welcomeMsg');
  if(welcome) welcome.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? 'Y' : 'C';

  const right = document.createElement('div');
  const bbl = document.createElement('div');
  bbl.className = 'bubble';
  bbl.innerHTML = role === 'user' ? content.replace(/</g,'&lt;') : md(content);
  right.appendChild(bbl);

  if(role === 'bot' && movies && movies.length){
    const bdg = document.createElement('div');
    bdg.className = 'badge';
    const shown = movies.slice(0,4).join(', ') + (movies.length>4 ? ` +${movies.length-4}` : '');
    bdg.innerHTML = `Konteks: <span>${shown}</span>`;
    right.appendChild(bdg);
  }

  wrap.appendChild(av);
  wrap.appendChild(right);
  win.appendChild(wrap);
  win.scrollTop = win.scrollHeight;
}

function addTyping(){
  const w = document.createElement('div');
  w.className = 'msg bot typing'; w.id = 'typing';
  w.innerHTML = '<div class="avatar" style="font-style:italic">C</div><div class="bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  win.appendChild(w); win.scrollTop = win.scrollHeight;
}

async function send(){
  if(isLoading) return;
  const msg = ta.value.trim();
  if(!msg) return;
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  ta.value = ''; resize(ta);
  addMsg('user', msg, null);
  addTyping();

  try {
    const res = await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, session_id:sessionId})
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    if(!res.ok){ showToast('Error: '+(data.error||'Unknown')); }
    else { sessionId = data.session_id; addMsg('bot', data.answer, data.movies_retrieved); }
  } catch(e){
    document.getElementById('typing')?.remove();
    showToast('Network error: '+e.message);
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    ta.focus();
  }
}

async function reset(){
  if(sessionId) await fetch('/api/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId})});
  sessionId = null;
  win.innerHTML = `<div class="welcome" id="welcomeMsg">
    <div class="welcome-ornament">❝</div>
    <div class="welcome-title">Apa yang ingin kamu ketahui?</div>
    <div class="welcome-line"></div>
    <div class="welcome-text">Tanya tentang sinopsis, pemeran, budget, skor, genre, atau minta rekomendasi.<br>Semua jawaban bersumber dari database — tidak ada rekayasa.</div>
  </div>`;
}

document.getElementById('sendBtn').addEventListener('click', send);
ta.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()} });
ta.addEventListener('input', e=>resize(e.target));
document.getElementById('resetBtn').addEventListener('click', reset);
document.getElementById('exChips').querySelectorAll('.chip').forEach(b=>{
  b.addEventListener('click',()=>{ ta.value=b.textContent; resize(ta); ta.focus(); });
});
</script>
</body>
</html>
